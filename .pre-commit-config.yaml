repos:
  # Python linting with ruff
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 'v0.6.0'
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Python type checking with mypy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.13.0'
    hooks:
      - id: mypy
        additional_dependencies: [pydantic, pydantic-settings]
        # Type-check the production source under apps/api/src at strict mode.
        # The test tree is type-checked separately in CI at relaxed strictness.
        args: [--strict, --ignore-missing-imports]
        exclude: ^(tests/|apps/web/)

  # Python AST checking
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 'v4.7.0'
    hooks:
      - id: check-ast
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml

  # Architectural import contracts (http -> services -> core)
  - repo: local
    hooks:
      - id: import-contracts
        name: Check import contracts (grimp)
        entry: uv run --with grimp --with pyyaml python scripts/check_imports.py
        language: system
        pass_filenames: false
        files: ^apps/api/src/leasora_api/.*\.py$

  # PII Detection (Custom hook for safety)
  # This regex-based scanner flags SSN, credit card, account numbers, and signature patterns
  - repo: local
    hooks:
      - id: detect-pii
        name: Detect PII patterns
        entry: python scripts/pre-commit-pii-scan.py
        language: python
        types_or: [python, text, markdown]
        exclude: ^(_deprecated/|docs/ADR/|\.kiro/specs/)
        stages: [pre-commit]

  # TypeScript/JavaScript formatting and linting (if present)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: 'v3.1.0'
    hooks:
      - id: prettier
        types_or: [javascript, jsx, typescript, tsx, json, markdown, yaml]
        exclude: ^(apps/web/\.next|apps/web/node_modules)

  # ESLint (optional; if project uses it)
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: 'v9.0.0'
    hooks:
      - id: eslint
        types: [javascript, jsx, typescript, tsx]
        exclude: ^(apps/web/\.next|apps/web/node_modules)
        additional_dependencies: ['eslint']

# Global settings
default_language_version:
  python: python3.12
  node: '20.0.0'

# Skip hooks that require network or are slow
exclude: |
  (?x)^(
    \.git/|
    \.hypothesis/|
    node_modules/|
    venv/|
    \.venv/|
    __pycache__/|
    \.pytest_cache/|
    \.ruff_cache/|
    \.mypy_cache/|
    dist/|
    build/|
    \.next/|
    apps/web/\.next
  )$
