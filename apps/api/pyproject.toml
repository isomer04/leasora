[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/leasora_api"]

[project]
name = "leasora-api"
version = "0.2.0"
description = "Leasora FastAPI backend for lease analysis"
requires-python = ">=3.12"
dependencies = [
    "FastAPI>=0.116.0",
    "uvicorn[standard]>=0.51.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.1.0",
    "groq==0.13.0",
    "httpx>=0.28.1,<0.29.0",
    "sentence-transformers>=2.2.0",
    "pdfplumber>=0.9.0",
    "python-json-logger>=2.0.0",
    "python-multipart>=0.0.9",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.2",
    "langfuse>=4.0.0,<5.0.0",
    "PyYAML>=6.0",
    "regex>=2023.0",
    # Required for the ``/metrics`` endpoint to render structured output.
    "prometheus-client>=0.20.0",
]

[project.scripts]
leasora = "leasora_api.cli.main:app"
leasora-ingest = "leasora_api.cli.ingest:main"
leasora-query = "leasora_api.cli.query:main"
leasora-eval = "leasora_api.cli.eval:run"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio>=0.23.0",
    "mypy",
    "ruff",
    "hypothesis>=6.100.0",
    "types-regex==2026.7.10.20260711",
    "types-PyYAML==6.0.12.20260518",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "chromadb.*", "pdfplumber.*", "rank_bm25.*"]
ignore_missing_imports = true

# The test tree is intentionally checked at *relaxed* strictness
# while the production source is checked at full --strict.
# `strict = true` at the top of this file applies repo-wide by default, so
# without this override tests would be type-checked at full strictness.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
check_untyped_defs = false
disallow_any_generics = false
warn_return_any = false

[tool.coverage.run]
# Per-package isolation for coverage reports.
source = ["leasora_api"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
# Show per-subpackage line and branch coverage.
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# `eval`-marked tests make real LLM calls and are excluded from default runs.
# Run explicitly with: uv run pytest -m eval
#
# Coverage threshold is set to 80% (current measured baseline for unit + integration tests).
addopts = [
    "-v",
    "--cov=leasora_api",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "-m not eval",
]
asyncio_mode = "auto"
markers = [
    "eval: marks tests as part of the (slower, real-LLM-call) eval suite; excluded by default, run with `-m eval`",
    "requires_llm: marks tests that require a real LEASORA_GROQ_API_KEY to run (skipped when absent)",
]
